<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工智能学习计划</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tables.css"><link rel="stylesheet" href="course-tables.css"><link rel="stylesheet" href="task-timer.css"><link rel="stylesheet" href="avatar.css"></head><body>
<div id="auth" class="auth"><div class="intro"><div class="brand"><span class="brand-symbol" aria-hidden="true">◈</span><span class="brand-name"><span>人工智能</span><span>学习计划</span></span><small>AI STUDY PLANNER</small></div><h1>把每一天，<br>安排成喜欢的样子。</h1><p>学习、作业、运动和生活。<br>由你安排，按自己的节奏完成。</p><div class="orbit">✓<span>PLAN · DO · REFLECT</span></div><p class="muted">每天做什么，你自己说了算。</p></div><form id="authForm" class="auth-card"><span class="eyebrow">A SPACE FOR YOUR EVERYDAY</span><h2 id="authTitle">欢迎回来</h2><p class="muted">登录，查看你的任务和课程。</p><label>用户名<input name="username" required minlength="3" maxlength="40" autocomplete="username" placeholder="请输入用户名"></label><label>密码<input name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="至少 8 位"></label><label id="nameField" hidden>称呼<input name="name" value="学习者" maxlength="40"></label><p id="authError" role="alert"></p><button type="submit" class="primary" id="authSubmit">登录计划空间 →</button><button type="button" class="link" id="switchAuth">还没有账号？创建计划空间</button><small class="muted">新账号清单为空，任务由你自己添加。</small></form></div>
<div id="app" hidden><aside><div class="brand"><span class="brand-symbol" aria-hidden="true">◈</span><span class="brand-name"><span>人工智能</span><span>学习计划</span></span></div><div class="side-caption">你的每日计划空间</div><nav aria-label="主导航"><button data-view="today" class="active">◷ 每日计划</button><button data-view="courses">▤ 课程资料库</button><button data-view="journal">▧ 任务记录</button><button data-view="settings">⚙ 个人设置</button></nav><div class="side-bottom"><div class="seed">一点安排，一点行动。<br>让日子有自己的节奏。</div></div></aside><main><header><span id="breadcrumb">人工智能学习计划 / 每日计划</span><div class="profile-header-account"><span class="profile-avatar" id="profileAvatar" aria-hidden="true"></span><span class="profile" id="profile"></span><button id="logout" class="link">退出登录</button></div></header><div id="content"></div></main></div>
<dialog id="taskDialog"><form id="taskForm"><h2 id="taskDialogTitle">新建任务</h2><label>任务名称<input name="title" required maxlength="200" placeholder="今天想完成什么？"></label><div class="form-grid"><label>安排日期<input name="day" type="date" required></label><label>分类<input name="category" maxlength="30" list="categories"></label><label>预计用时（分钟）<input name="planned" type="number" min="1" max="600" required></label></div><div id="taskProgress"><fieldset class="task-timing"><legend>实际时间（可选）</legend><div class="task-time-inputs"><label>实际开始时间<input name="started_at" type="datetime-local" step="1"></label><label>实际结束时间<input name="finished_at" type="datetime-local" step="1"></label></div><p id="taskTimingHint" class="muted" role="status"></p></fieldset><label>实际投入（分钟）<input name="actual" type="number" min="0" max="1440" required></label><label class="check"><input name="done" type="checkbox">已经完成这项任务</label></div><label>笔记 / 进展与问题<textarea name="note" rows="4" maxlength="10000" placeholder="写下进展或需要记住的事。"></textarea></label><div class="actions"><button type="button" id="cancelDialog">取消</button><button type="submit" class="primary">保存任务</button></div></form></dialog>
<dialog id="courseDialog"><form id="courseForm"><h2 id="courseDialogTitle">添加课程</h2><label>课程名称<input name="title" required maxlength="200"></label><label>课程链接（可选）<input name="url" type="url" maxlength="2048" placeholder="https://…"></label><label>来源<select name="source"><option value="user">我的课程</option><option value="supplement">补充推荐</option></select></label><label>课程说明 / 资料位置<textarea name="description" rows="5" maxlength="10000"></textarea></label><p class="muted">保存课程不会自动生成每日任务。</p><div class="actions"><button type="button" id="cancelCourse">取消</button><button type="submit" class="primary">保存课程</button></div></form></dialog>
<datalist id="categories"><option value="学习"><option value="课程作业"><option value="韩语"><option value="运动"><option value="生活"><option value="其他"></datalist><div id="toast" role="status"></div><script src="task-timer.js"></script><script src="app.js"></script></body></html>
