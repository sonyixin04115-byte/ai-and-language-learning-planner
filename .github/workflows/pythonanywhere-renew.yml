name: PythonAnywhere 免费运行确认

"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只读取到期日期，不点击续期'
        required: false
        default: false
        type: boolean
  schedule:
    # UTC 02:17 = Asia/Shanghai 10:17 / Korea 11:17, every 1st and 15th.
    - cron: '17 2 1,15 * *'

permissions:
  contents: read

concurrency:
  group: pythonanywhere-free-renewal
  cancel-in-progress: false

jobs:
  renew:
    if: github.repository_owner == 'sonyixin04115-byte' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 读取受控脚本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: 准备 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 核验续期规则
        run: python -m unittest discover -s tests -p test_free_hosting.py -v
      - name: 安装固定版本浏览器
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: 确认免费网站继续运行并验证新日期
        env:
          PA_USERNAME: yixin666
          PA_DOMAIN: yixin666.pythonanywhere.com
          PYTHONANYWHERE_PASSWORD: ${{ secrets.PYTHONANYWHERE_PASSWORD }}
          PA_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python deploy/renew_free_hosting.py
